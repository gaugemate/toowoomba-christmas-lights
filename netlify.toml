# Netlify hosting settings. The app is plain files, so there's nothing to build:
# Netlify serves this folder as it is, and redeploys whenever the main branch changes on GitHub.
[build]
  publish = "."
  command = ""

# The service worker must never be cached, or phones keep running an old version of the app
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Basic safety headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"
