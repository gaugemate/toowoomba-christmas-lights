<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Toowoomba Christmas Lights app icon: the master copy the PNG icons are drawn from. The maskable icon is this artwork shrunk to 80% on the same background. -->
  <defs>
    <radialGradient id="glow" cx="96" cy="122" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6c543" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#f6c543" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f6c543" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="80" cy="100" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4b43"/>
      <stop offset=".6" stop-color="#df3c37"/>
      <stop offset="1" stop-color="#c22a29"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" fill="#0d3b2c"/>
  <circle cx="96" cy="122" r="80" fill="url(#glow)"/>
  <path d="M14 46 Q96 72 178 46" fill="none" stroke="#b6cac1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="35" cy="57" r="6.5" fill="#4fc3f7"/>
  <circle cx="157" cy="57" r="6.5" fill="#9fe08f"/>
  <rect x="77" y="55" width="38" height="25" rx="4" fill="#f6c543"/>
  <rect x="77" y="66" width="38" height="3" fill="#d9a52a"/>
  <circle cx="96" cy="123" r="44" fill="url(#ball)"/>
  <ellipse cx="78" cy="111" rx="7" ry="17" transform="rotate(25 78 111)" fill="#fff" opacity=".35"/>
